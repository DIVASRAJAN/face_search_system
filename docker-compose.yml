services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: face-attendance-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - CHROMA_DATA_PATH=/app/data/chromadb
      - ATTENDANCE_CSV_PATH=/app/data/attendance.csv
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: face-attendance-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
